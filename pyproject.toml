[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyphony"
version = "0.1.0"
description = "Local-first, CLI-driven multi-agent orchestrator powered by Claude Code, AGY, and Cursor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
polyphony = "orchestrator.cli:cli"
ai-orch = "orchestrator.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "executors*", "migrate*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["medicoder", "migration", ".venv", "env"]
