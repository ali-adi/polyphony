[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyphony"
version = "0.3.0.dev0"
description = "An MCP server that hands isolated coding tasks to agent CLIs (agy, cursor-agent, claude)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ali Adi" }]
keywords = ["mcp", "claude-code", "codex", "antigravity", "cursor", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "mcp>=2.2,<3",
    "pyte>=0.8",
]

[project.urls]
Homepage = "https://github.com/ali-adi/polyphony"
Repository = "https://github.com/ali-adi/polyphony"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "vulture>=2.11",
]

[project.scripts]
polyphony = "polyphony.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["polyphony*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "env"]
markers = [
    "smoke: spawns real CLI binaries and consumes subscription quota (deselected by default; run with -m smoke)",
]
addopts = "-m 'not smoke'"

[tool.ruff]
target-version = "py311"
exclude = [".venv", "env"]

[tool.ruff.lint]
select = ["F"]

[tool.vulture]
paths = ["polyphony", "tests"]
min_confidence = 80
