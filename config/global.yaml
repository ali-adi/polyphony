# Global Configuration for Polyphony

defaults:
  executors:
    lead: "claude"
    primary: "agy"
    secondary: "cursor"
    python: "python3"
  
  limits:
    max_iterations: 10
    timeout_seconds: 600
    claude_max_calls_per_task: 5

models:
  lead:
    claude:
      model: "claude-3-7-sonnet-20250219"
      thinking_level: "high"
      fallback_model: "claude-3-5-sonnet-20241022"
    agy:
      model: "gemini-3.1-pro-high"
      thinking_level: "high"
      fallback_model: "gemini-3.8-flash-high"
  executors:
    agy:
      model: "gemini-3.8-flash-high"
      thinking_level: "medium"
    cursor:
      model: "claude-3.7-sonnet"
      thinking_level: "medium"
    claude:
      model: "claude-3-5-haiku-20241022"
      thinking_level: "low"
  subagents:
    default_model: "gemini-3.8-flash-medium"
    default_thinking_level: "low"
    roles:
      reviewer:
        model: "claude-3-7-sonnet-20250219"
        thinking_level: "high"
        description: "Reviews code changes, checks edge cases and security"
      tester:
        model: "gemini-3.8-flash-low"
        thinking_level: "low"
        description: "Executes and diagnoses unit and regression tests"
      researcher:
        model: "gemini-3.1-pro-high"
        thinking_level: "medium"
        description: "Researches repository patterns and external documentation"

safety:
  enforce_read_only_default: false
  block_dangerous_git: true
  enforce_verification_tests: true
  blocked_global_commands:
    - "rm -rf /"
    - "rm -rf ~"
    - ":(){ :|:& };:"
    - "mkfs"
    - "dd if="

logging:
  log_dir: "logs"
  level: "INFO"
  structured_json: true
